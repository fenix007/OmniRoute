name: Fork Image (fenix007)

# Builds the stable-branch fork image (v3.8.48 + our patch set) and publishes it
# to GHCR. Tag scheme deliberately avoids the upstream "v*" pattern so the
# inherited release workflows (docker-publish, electron-release) never fire.
on:
  push:
    branches: [stable]
    tags:
      - "*-fork.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/fenix007/omniroute

jobs:
  build:
    name: Build and Push Fork Image
    if: github.repository == 'fenix007/OmniRoute'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=stable,enable=${{ github.ref == 'refs/heads/stable' }}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=omniroute
            org.opencontainers.image.description=OmniRoute stable fork (v3.8.48 + fenix007 patch set)
            org.opencontainers.image.url=https://github.com/fenix007/OmniRoute
            org.opencontainers.image.source=https://github.com/fenix007/OmniRoute
            org.opencontainers.image.licenses=MIT

      # target/platforms mirror upstream docker-publish.yml's main image
      # (plain tag = runner-base; the -web variant is not built here).
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
